name: Server Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - mac-app
    paths:
      - .github/workflows/server-docker.yml
      - build.gradle
      - core/**
      - server/**
      - data/**
      - scripts/**
      - bin/server/**
      - docker/server/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push ghcr.io image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache game data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: bin/server/packages
          key: server-data-${{ hashFiles('data/**', 'scripts/**') }}

      - name: Install data build dependencies
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: pip install PyCryptodome cffi setuptools "git+https://github.com/desertkun/hjson-py"

      - name: Build server game data
        if: steps.data-cache.outputs.cache-hit != 'true'
        working-directory: scripts
        run: python make_data.py server

      - name: Build server jar
        run: ./gradlew --no-daemon :server:dist

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brainout-server" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

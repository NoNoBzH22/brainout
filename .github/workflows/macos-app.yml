name: macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - mac-app

jobs:
  build:
    name: Build BrainOut.app (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data build dependencies
        run: pip install PyCryptodome cffi setuptools "git+https://github.com/desertkun/hjson-py"

      - name: Build game data
        working-directory: scripts
        run: python make_data.py client

      - name: Build client jar
        run: ./gradlew --no-daemon :desktop:dist -x :desktop:obfuscate

      - name: Assemble BrainOut.app
        run: bash macos/build_app.sh build/macos

      - name: Zip app
        run: ditto -c -k --keepParent build/macos/BrainOut.app build/macos/BrainOut-macOS-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BrainOut-macOS-arm64
          path: build/macos/BrainOut-macOS-arm64.zip
          compression-level: 0

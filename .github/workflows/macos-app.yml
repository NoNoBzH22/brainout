name: macOS app

on:
  workflow_dispatch:
  push:
    branches:
      - mac-app
    paths:
      - .github/workflows/macos-app.yml
      - build.gradle
      - core/**
      - client/**
      - desktop/**
      - data/**
      - scripts/**
      - macos/**

jobs:
  build:
    name: Build BrainOut.app (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Building the data packs textures for ~10 minutes, so reuse the result
      # until something under data/ or scripts/ changes.
      - name: Cache game data
        id: data-cache
        uses: actions/cache@v4
        with:
          path: bin/client/packages
          key: client-data-${{ hashFiles('data/**', 'scripts/**') }}

      - name: Install data build dependencies
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: pip install PyCryptodome cffi setuptools "git+https://github.com/desertkun/hjson-py"

      - name: Build game data
        if: steps.data-cache.outputs.cache-hit != 'true'
        working-directory: scripts
        run: python make_data.py client

      - name: Build client jar
        run: ./gradlew --no-daemon :desktop:dist -x :desktop:obfuscate

      - name: Assemble BrainOut.app
        run: bash macos/build_app.sh build/macos

      - name: Zip app
        run: ditto -c -k --keepParent build/macos/BrainOut.app build/macos/BrainOut-macOS-arm64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: BrainOut-macOS-arm64
          path: build/macos/BrainOut-macOS-arm64.zip
          compression-level: 0

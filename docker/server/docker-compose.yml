# BrainOut open world (Free Play) with player-like bots.
# In the game, connect to the IP of the machine running this container.
# The three ports must be published with the same numbers.
services:
  brainout:
    image: ghcr.io/nonobzh22/brainout-server:latest
    container_name: brainout
    restart: unless-stopped
    environment:
      PORT: "36555"
      BOTS: "8"
      BOT_DIFFICULTY: mix
      # only these names can create an account, separated by commas
      ALLOWED_ACCOUNTS: ""
      # accounts allowed to use admin console commands
      ADMINS: ""
    volumes:
      # accounts, inventories and progress survive updates of the container
      - /DATA/AppData/brainout:/data
    ports:
      - "36555:36555/tcp"
      - "36556:36556/udp"
      - "36557:36557/tcp"

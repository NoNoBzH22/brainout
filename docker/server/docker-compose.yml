# BrainOut open world (Free Play) with player-like bots.
# In the game, connect to the IP of the machine running this container.
# The three ports must be published with the same numbers.
services:
  brainout:
    image: ghcr.io/nonobzh22/brainout-server:latest
    container_name: brainout
    restart: unless-stopped
    # the server runs as uid 10001 without any privilege; before the first start:
    #   chown -R 10001:10001 /DATA/AppData/brainout
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    environment:
      PORT: "36555"
      BOTS: "8"
      # adaptive: bots match the gear and kill streak of the players around them
      BOT_DIFFICULTY: adaptive
      # bot damage and accuracy multipliers (admins can also change them live with /botdegats and /botprecision)
      BOT_DAMAGE: "1"
      BOT_ACCURACY: "1"
      # only these names can create an account, separated by commas
      ALLOWED_ACCOUNTS: ""
      # accounts allowed to use admin console commands
      ADMINS: ""
    volumes:
      # accounts, inventories and progress survive updates of the container
      - /DATA/AppData/brainout:/data
    ports:
      - "36555:36555/tcp"
      - "36556:36556/udp"
      - "36557:36557/tcp"

# BrainOut private server: open world, deathmatch and capture the flag, all with bots.
# In the game, enter the IP of the machine running this container: you arrive in the lobby,
# where the portals lead to the open world, deathmatch and capture the flag.
# Each mode uses three ports (tcp, udp, http), published with the same numbers.
services:
  brainout:
    image: ghcr.io/nonobzh22/brainout-server:latest
    container_name: brainout
    restart: unless-stopped
    # the server runs as uid 10001 without any privilege; before the first start:
    #   chown -R 10001:10001 /DATA/AppData/brainout
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 3g
    cpus: 2
    pids_limit: 256
    environment:
      PORT: "36555"
      BOTS: "8"
      # adaptive: bots match the gear and kill streak of the players around them
      BOT_DIFFICULTY: adaptive
      # modes to run: lobby, free (open world), deathmatch, ctf (capture the flag)
      MODES: "lobby,free,deathmatch,ctf"
      # bots filling deathmatch and capture the flag games, and their skill
      MATCH_BOTS: "8"
      MATCH_BOT_DIFFICULTY: adaptive
      # bot damage and accuracy multipliers (admins can also change them live with /botdegats and /botprecision)
      BOT_DAMAGE: "1"
      BOT_ACCURACY: "1"
      # scrap (currency of weapon upgrades) dropped by bots: 0 none, 1 normal, 2 twice as much
      BOT_JUNK: "1"
      # minutes between open world events (weapon air drops, a boss to hunt), 0 disables them
      EVENT_MINUTES: "20"
      # experience multiplier: 3 levels up three times faster
      XP_MULTIPLIER: "1"
      # only these names can create an account, separated by commas
      ALLOWED_ACCOUNTS: ""
      # accounts allowed to use admin console commands
      ADMINS: ""
      # copy of the accounts into /DATA/AppData/brainout/backups every 24 hours, the last 7 kept
      BACKUP_HOURS: "24"
      BACKUP_KEEP: "7"
    volumes:
      # accounts, inventories and progress survive updates of the container
      - /DATA/AppData/brainout:/data
    ports:
      # open world
      - "36555:36555/tcp"
      - "36556:36556/udp"
      - "36557:36557/tcp"
      # deathmatch
      - "36565:36565/tcp"
      - "36566:36566/udp"
      - "36567:36567/tcp"
      # capture the flag
      - "36575:36575/tcp"
      - "36576:36576/udp"
      - "36577:36577/tcp"
      # lobby
      - "36585:36585/tcp"
      - "36586:36586/udp"
      - "36587:36587/tcp"
